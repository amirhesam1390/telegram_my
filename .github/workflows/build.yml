name: Build OwpenGram APK (Android Only)

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Install SDK 36 + NDK 27 + CMake
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
        yes | sdkmanager --licenses || true

    - name: Setup Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          TMessagesProj/.cxx
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Standalone APK (Android Only)
      run: |
        ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
          --stacktrace \
          --no-daemon \
          -x lint \
          -x lintVitalAfatStandalone \
          -x lintVitalStandalone

    - name: List APK outputs
      if: always()
      run: |
        echo "=== APK files found ==="
        find TMessagesProj_AppStandalone/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owpengram-android-apk
        path: 'TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk'
        if-no-files-found: warn
        retention-days: 30
