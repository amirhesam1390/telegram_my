name: Build OwpenGram APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK 36 + NDK 27 + CMake
      run: |
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
        yes | sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Standalone APK
      run: |
        ./gradlew :TMessagesProj_AppStandalone:assembleStandalone --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owpengram-apk
        path: 'TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk'
        if-no-files-found: warn
